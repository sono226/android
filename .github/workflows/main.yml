name: Build Android APK

on:
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest # Uses a clean Linux virtual machine

    steps:
    # 1. Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up JDK (Java Development Kit)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Build the APK with Gradle
    - name: Build with Gradle
      run: |
        chmod +x gradlew # Make the Gradle wrapper executable on Linux
        ./gradlew assembleDebug # The command to build a debug APK

    # 4. Upload the built APK as a downloadable artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cryptomator-apk
        path: app/build/outputs/apk/debug/*.apk # This is the standard output path
